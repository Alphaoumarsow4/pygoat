name: Security CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit

      - name: Run Bandit SAST scan (JSON report)
        run: bandit -r . -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: Run Bandit SAST scan (console output)
        run: bandit -r . -ll
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: bandit-report.json

      - name: Enforce security gate (fail build on High severity findings)
        run: |
          HIGH_COUNT=$(python -c "import json;d=json.load(open('bandit-report.json'));print(sum(1 for r in d['results'] if r['issue_severity']=='HIGH'))")
          echo "High severity findings: $HIGH_COUNT"
          if [ "$HIGH_COUNT" -gt "0" ]; then
            echo "Build failed: high severity security issues detected."
            exit 1
          fi
